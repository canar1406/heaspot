name: Release HeaSpot

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build, sign and publish NSIS updater
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "HeaSpot v__VERSION__"
          releaseBody: |
            - Ổn định vòng đời focus: đổi cửa sổ và Esc luôn ẩn launcher đúng lúc.
            - Gỡ cài đặt trong cửa sổ tiến trình riêng, hỗ trợ nhiều loại ứng dụng và dọn dấu vết an toàn.
            - OTP mới nhất ở đầu; secret trùng thay bản cũ, giữ tên/ghi chú còn thiếu và không tạo bản sao.
            - Câu trả lời nhanh được tổng hợp rõ hơn, phản hồi nhanh hơn nhưng vẫn giữ nguồn tham khảo.
            - Auto-update có chữ ký, thanh tải và release notes.
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          includeUpdaterJson: true
          retryAttempts: 2
