name: Release HeaSpot

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build, sign and publish NSIS updater
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "HeaSpot v__VERSION__"
          releaseBody: |
            - Sửa vòng đời focus: đổi cửa sổ và Esc luôn ẩn launcher ổn định.
            - Gỡ cài đặt trong cửa sổ tiến trình riêng, hỗ trợ 7-Zip/MSI/UWP/portable và dọn dấu vết an toàn.
            - OTP xếp mới nhất trước, cho phép hiện/copy secret key được DPAPI bảo vệ.
            - Tích hợp auto-update có chữ ký, thanh tải và release notes.
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          includeUpdaterJson: true
          retryAttempts: 2
